name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-test-push-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Check project files
      - name: Check project files
        run: ls -la

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-devops-app:latest .

      # 4. Test Docker image
      - name: Test Docker image
        run: |
          docker run -d \
            --name test-container \
            -p 8080:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-devops-app:latest

          sleep 5

          curl http://localhost:8080

      # 5. Stop test container
      - name: Stop test container
        run: |
          docker stop test-container

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-devops-app:latest

      # 8. Prepare SSH key
      - name: Prepare SSH key
        shell: bash
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

      # 9. Deploy application to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: /tmp/ec2_key
          script: |
            docker pull mendarohithkumar/cloud-devops-app:latest

            docker stop cloud-devops-container || true

            docker rm cloud-devops-container || true

            docker run -d \
              --name cloud-devops-container \
              -p 80:80 \
              mendarohithkumar/cloud-devops-app:latest

            docker ps