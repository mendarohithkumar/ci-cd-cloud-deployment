name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: ls -la

      - name: Build Docker image
        run: docker build -t cloud-devops-app:latest .

      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 8080:80 cloud-devops-app:latest
          sleep 5
          curl http://localhost:8080

      - name: Stop test container
        run: docker stop test-container