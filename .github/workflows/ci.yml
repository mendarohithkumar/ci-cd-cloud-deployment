name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-test-push-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Check project files
      - name: Check project files
        run: ls -la

      # 3. Build Docker image with version tag
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-devops-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloud-devops-app:latest .

      # 4. Test Docker image
      - name: Test Docker image
        run: |
          docker run -d \
            --name test-container \
            -p 8080:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-devops-app:${{ github.sha }}

          sleep 5

          curl http://localhost:8080

      # 5. Stop test container
      - name: Stop test container
        run: |
          docker stop test-container
          docker rm test-container

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Push versioned image
      - name: Push versioned Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-devops-app:${{ github.sha }}

      # 8. Push latest image
      - name: Push latest Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-devops-app:latest

      # 9. Deploy versioned image to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull mendarohithkumar/cloud-devops-app:${{ github.sha }}

            docker stop cloud-devops-container || true

            docker rm cloud-devops-container || true

            docker run -d \
              --restart unless-stopped \
              --name cloud-devops-container \
              -p 80:80 \
              mendarohithkumar/cloud-devops-app:${{ github.sha }}

            docker ps

      # 10. Verify deployment
      - name: Verify deployment
        run: |
          sleep 10
          curl http://${{ secrets.EC2_HOST }}
